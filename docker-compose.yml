# =============================================
# Docker Compose - Agency CRM (Application Stack)
# Services: Backend API, Frontend
# External Production DB: company_crm_mongodb on company_crm_network
# =============================================

services:

  # ── Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agency_crm_backend
    restart: unless-stopped
    expose:
      - "5001"
    ports:
      - "127.0.0.1:5005:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      ENABLE_CLUSTER: ${ENABLE_CLUSTER:-true}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-500}
      # External production MongoDB container (company_crm_mongodb)
      MONGO_URI: ${MONGO_URI:-mongodb://company-crm-mongodb:27017/company_crm}
      CLIENT_URL: ${CLIENT_URL:-https://agencyupscale.com}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://agencyupscale.com,https://www.agencyupscale.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in environment}
      JWT_EXPIRE: ${JWT_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in environment}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      # Cloudinary (optional - for file uploads)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Google OAuth 2.0 (Login & Signup)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Razorpay Plan Billing
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # CAPTCHA Provider (hCaptcha / Cloudflare Turnstile / reCAPTCHA)
      HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # Web Push Notifications (VAPID)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:risewithmediaofficial@gmail.com}
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - company_crm_network

  # ── Frontend (Nginx + React) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-BKwkgrewQmAAflMVBGwXiK-MRe6MbZl6DNxH18aOwIU-mNTukiW3hLOTGcxdplps7T8NlcteaEVar_5zP6KlYMs}
    container_name: agency_crm_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:82:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - company_crm_network

# ── Volumes ──────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ── Networks ─────────────────────────────────────────
networks:
  company_crm_network:
    external: true
