name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Application Services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /docker/company

            echo "Before deploy: $(git rev-parse --short HEAD)"
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Stashing local tracked modifications before deploy..."
              git stash push -m "auto-backup-before-deploy-$(date +%s)" || true
            fi

            git fetch origin main
            git reset --hard origin/main
            echo "Deploying commit: $(git rev-parse --short HEAD)"

            # Ensure required .env keys exist on VPS without overwriting existing values
            touch .env
            grep -qE '^MONGO_URI=.+' .env || echo 'MONGO_URI=mongodb://company-crm-mongodb:27017/company_crm' >> .env
            grep -qE '^JWT_SECRET=.+' .env || echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
            grep -qE '^JWT_REFRESH_SECRET=.+' .env || echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> .env
            grep -qE '^ENCRYPTION_KEY=.+' .env || echo "ENCRYPTION_KEY=$(openssl rand -hex 16)" >> .env

            # Validate Docker Compose configuration before deploying
            docker compose config -q

            # Build new images while the live site stays online
            docker compose build backend frontend

            # Enable maintenance page only during container recreation + health verification
            mkdir -p /var/www/agencyupscale
            trap 'rm -f /var/www/agencyupscale/maintenance.enable' EXIT
            touch /var/www/agencyupscale/maintenance.enable

            # Deploy only application services; never touch external MongoDB or volumes
            docker compose up -d --no-deps backend frontend

            # Verify backend health (fail deployment if unhealthy)
            echo "Waiting for backend healthcheck..."
            HEALTHY=0
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' agency_crm_backend 2>/dev/null || echo "starting")
              echo "Attempt $i/18: agency_crm_backend health=$STATUS"
              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=1
                break
              fi
              sleep 5
            done

            docker compose ps
            docker compose logs --tail=30 backend

            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: agency_crm_backend failed health verification!"
              exit 1
            fi

            rm -f /var/www/agencyupscale/maintenance.enable
            echo "Deployment verified healthy."
