# =============================================
# Host Nginx Virtual Host — https://agencyupscale.com
# Install on VPS at: /etc/nginx/sites-available/agencyupscale.com
# Symlink: ln -s /etc/nginx/sites-available/agencyupscale.com /etc/nginx/sites-enabled/
# Cloudflare Origin Certificate paths:
#   /etc/ssl/cloudflare/agencyupscale.com.pem
#   /etc/ssl/cloudflare/agencyupscale.com.key
# =============================================

server {
    listen 80;
    listen [::]:80;
    server_name agencyupscale.com www.agencyupscale.com app.agencyupscale.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.agencyupscale.com;

    ssl_certificate     /etc/ssl/cloudflare/agencyupscale.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/agencyupscale.com.key;

    return 301 https://agencyupscale.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agencyupscale.com app.agencyupscale.com;

    ssl_certificate     /etc/ssl/cloudflare/agencyupscale.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/agencyupscale.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:82;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:82;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
    }
}
